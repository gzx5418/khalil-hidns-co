    [-.82 + .34 * Math.sin(t), -.72 + .31 * Math.cos(t * .73), A, .78],
    [.77 + .34 * Math.cos(t * .82), -.58 + .39 * Math.sin(t * .61), B, .66],
    [-.55 + .38 * Math.cos(t * .71 + 2), .76 + .27 * Math.sin(t * .89 + 1), C, .77],
    [.77 + .26 * Math.sin(t * .94 + 2), .64 + .32 * Math.cos(t * .74), mix, .54],
    [.03 + .28 * Math.sin(t * .65 + 3), .13 + .35 * Math.cos(t * .63 + 1), deep, .42]
  ];
  const data = fFrame.data; let k = 0;
  for (let y = 0; y < FH; y++) { const py = fY[y];
    for (let x = 0; x < FW; x++) { const px = fX[x];
      const u = px + .27 * Math.sin(py * 2.35 + t * 1.23) + .12 * Math.sin(px * 2.2 - py * 2.1 - t * .83);
      const v = py + .24 * Math.cos(px * 2.17 - t * .93) + .13 * Math.sin(py * 2.6 + px * 1.5 + t * .72);
      let rr = 0, gg = 0, bb = 0, total = .085;
      for (const n of nodes) { const dx = u - n[0], dy = v - n[1], w = Math.exp(-(dx * dx + dy * dy) / (n[3] * n[3]) * 1.85); total += w; rr += n[2][0] * w; gg += n[2][1] * w; bb += n[2][2] * w; }
      const shape = .60 + .12 * Math.sin(u * 2.6 + v * 1.8 + t * .82) + .065 * Math.cos(v * 3.3 - u * 1.5 - t * .52);
      const shade = (.83 - .12 * py) * shape;
      data[k++] = Math.min(255, 5 + rr / total * shade);
      data[k++] = Math.min(255, 5 + gg / total * shade);
      data[k++] = Math.min(255, 7 + bb / total * shade);
      data[k++] = 255;
    }
  }
  fctx.putImageData(fFrame, 0, 0);
}
/* ---- 3D tilt + float state for the active card ---- */
let tiltRX = 3, tiltRY = -6, tiltTargetRX = 3, tiltTargetRY = -6, floatY = 0;

// build cards + dots
const cards = ALBUMS.map((a, i) => {
  const d = document.createElement('div');
  d.className = 'card';
  const back = document.createElement('div'); back.className = 'back'; d.appendChild(back);
  const face = document.createElement('div'); face.className = 'face';
  const img = document.createElement('img');
  img.src = a.cover; img.alt = a.title + ' 封面'; img.draggable = false;
  face.appendChild(img);
  const shine = document.createElement('div'); shine.className = 'shine'; face.appendChild(shine);
  d.appendChild(face);
  d.addEventListener('click', () => {
    if (Math.abs(pos - i) < 0.5) window.open(a.link, '_blank');
    else goTo(i);
  });
  stage.appendChild(d);
  const dot = document.createElement('i');
  dot.addEventListener('click', () => goTo(i));
  dotsEl.appendChild(dot);
  return d;
});
const dots = [...dotsEl.children];

// build grid, grouped by artist
const grid = document.getElementById('grid');
const artists = [...new Set(ALBUMS.map(a => a.artist))];
document.getElementById('subTitle').innerHTML = '<b>' + artists.join(' · ') + '</b> · 专辑收藏 ' + N + ' 张 · 拖动、滚轮或方向键切换，背景会跟着封面变色';
artists.forEach(artist => {
  const h = document.createElement('h4');
  h.textContent = artist + ' · ' + ALBUMS.filter(a => a.artist === artist).length + ' 张';
  grid.appendChild(h);
  const wrap = document.createElement('div');
  wrap.className = 'grid';
  ALBUMS.forEach((a, i) => {
    if (a.artist !== artist) return;
    const it = document.createElement('div');
    it.className = 'item';
    it.innerHTML = `<img src="${a.cover}" alt="${a.title} 封面" loading="lazy"><div class="meta"><b>${a.title}</b><span>${a.artist} · ${a.year}</span></div>`;
    it.addEventListener('click', () => { goTo(i); document.querySelector('.stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); });
    wrap.appendChild(it);
  });
  grid.appendChild(wrap);
});

// state + physics (friction 0.9, like the original's frictionFactor)
let pos = 0, target = 0, velocity = 0, active = -1;
let dragging = false, dragStartX = 0, dragStartPos = 0, lastX = 0, lastT = 0;
function clamp(v) { return Math.max(0, Math.min(N - 1, v)); }
function goTo(i) { target = clamp(i); }

function setActive(i) {
  if (i === active) return;
  active = i;
  const a = ALBUMS[i];
  capTitle.textContent = a.title;
  capMeta.textContent = `${a.artist} · ${a.year} · 第 ${i + 1} / ${N} 张`;
  capLink.href = a.link;
  dots.forEach((d, j) => d.classList.toggle('on', j === i));
  setFluidTarget(i);
  document.documentElement.style.setProperty('--glow', a.colors[0] + '66');
}
function render() {
  cards.forEach((card, i) => {
    const off = i - pos;
    const ao = Math.abs(off);
    const rot = Math.max(-MAX_ROT, Math.min(MAX_ROT, off * -MAX_ROT));
    const depth = Math.min(MAX_DEPTH, ao * MAX_DEPTH);
    const scale = Math.max(MIN_SCALE, 1 - ao * 0.08);
    const tb = Math.max(0, 1 - ao * 2);
    card.style.transform = `translateX(${off * CARD_GAP}px) translateY(${(floatY * tb).toFixed(1)}px) translateZ(${-depth}px) rotateY(${rot + tiltRY * tb}deg) rotateX(${tiltRX * tb}deg) scale(${scale})`;
    card.style.opacity = ao > 3.2 ? 0 : 1 - Math.max(0, ao - 2.2) * 0.55;
    card.style.zIndex = String(100 - Math.round(ao * 10));
    card.classList.toggle('active', Math.round(pos) === i && ao < 0.5);
  });
  setActive(clamp(Math.round(pos)));
}
function tick() {
  const nowT = performance.now();
  tiltRX += (tiltTargetRX - tiltRX) * 0.08;
  tiltRY += (tiltTargetRY - tiltRY) * 0.08;
  floatY = (fluidPaused || reducedMotion) ? 0 : Math.sin(nowT * Math.PI * 2 / 8000) * -7;
  fluidRender(nowT);
  if (!dragging) {
    velocity *= 0.9;
    pos += velocity;
    pos += (target - pos) * 0.14;
    if (Math.abs(target - pos) < 0.002 && Math.abs(velocity) < 0.002) pos = target;
    if (pos < 0) { pos = 0; velocity = 0; target = 0; }
    if (pos > N - 1) { pos = N - 1; velocity = 0; target = N - 1; }
  }
  render();
  requestAnimationFrame(tick);
}

// drag
stage.addEventListener('pointerdown', e => {
  dragging = true; stage.classList.add('dragging');
  dragStartX = lastX = e.clientX; dragStartPos = pos; velocity = 0; lastT = performance.now();
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - dragStartX;
  const now = performance.now();
  const instV = (e.clientX - lastX) / Math.max(1, now - lastT);
  lastX = e.clientX; lastT = now;
  pos = clamp(dragStartPos - dx / 200);
  velocity = -instV / 200 * 16;
});
function endDrag() {
  if (!dragging) return;
  dragging = false; stage.classList.remove('dragging');
  target = clamp(Math.round(pos - velocity * 6));
  velocity *= 0.5;
}
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', endDrag);

// 3D tilt: pointer over the stage tilts the active card; shine follows the pointer
stage.addEventListener('pointermove', e => {
  if (dragging) { tiltTargetRX = 0; tiltTargetRY = 0; return; }
  const r = stage.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
  tiltTargetRY = (x - 0.5) * 22;
  tiltTargetRX = (0.5 - y) * 18;
  const ai = clamp(Math.round(pos));
  const cr = cards[ai].getBoundingClientRect();
  if (cr.width > 0) {
    cards[ai].style.setProperty('--mx', ((e.clientX - cr.left) / cr.width * 100) + '%');
    cards[ai].style.setProperty('--my', ((e.clientY - cr.top) / cr.height * 100) + '%');
  }
});
stage.addEventListener('pointerleave', () => { tiltTargetRX = 3; tiltTargetRY = -6; });

// fluid background pause/play
const fluidToggle = document.getElementById('fluidToggle');
function syncFluidToggle() { fluidToggle.textContent = fluidPaused ? '播放流体背景' : '暂停流体背景'; }
fluidToggle.addEventListener('click', () => { fluidPaused = !fluidPaused; syncFluidToggle(); });
syncFluidToggle();

// wheel (throttled)
let wheelLock = 0;
stage.addEventListener('wheel', e => {
  e.preventDefault();
  const now = performance.now();
  if (now - wheelLock < 260) return;
  wheelLock = now;
  goTo(Math.round(pos) + (e.deltaY > 0 ? 1 : -1));
}, { passive: false });

// keyboard
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') goTo(Math.round(pos) + 1);
  if (e.key === 'ArrowLeft') goTo(Math.round(pos) - 1);
});
document.getElementById('prev').addEventListener('click', () => goTo(Math.round(pos) - 1));
document.getElementById('next').addEventListener('click', () => goTo(Math.round(pos) + 1));

render();
tick();
</script>
</body>
</html>
