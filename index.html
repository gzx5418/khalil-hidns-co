  const h = document.createElement('h4');
  h.textContent = artist + ' · ' + ALBUMS.filter(a => a.artist === artist).length + ' 张';
  grid.appendChild(h);
  const wrap = document.createElement('div');
  wrap.className = 'grid';
  ALBUMS.forEach((a, i) => {
    if (a.artist !== artist) return;
    const it = document.createElement('div');
    it.className = 'item';
    it.innerHTML = `<img src="${a.cover}" alt="${a.title} 封面" loading="lazy"><div class="meta"><b>${a.title}</b><span>${a.artist} · ${a.year}</span></div>`;
    it.addEventListener('click', () => { goTo(i); document.querySelector('.stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); });
    wrap.appendChild(it);
  });
  grid.appendChild(wrap);
});

// state + physics (friction 0.9, like the original's frictionFactor)
let pos = 0, target = 0, velocity = 0, active = -1;
let dragging = false, dragStartX = 0, dragStartPos = 0, lastX = 0, lastT = 0;
function clamp(v) { return Math.max(0, Math.min(N - 1, v)); }
function goTo(i) { target = clamp(i); }

function paintBg(layer, colors) {
  layer.querySelector('.blob1').style.background = `radial-gradient(circle, ${colors[0]} 0%, transparent 70%)`;
  layer.querySelector('.blob2').style.background = `radial-gradient(circle, ${colors[1] || colors[0]} 0%, transparent 70%)`;
}
function setActive(i) {
  if (i === active) return;
  active = i;
  const a = ALBUMS[i];
  capTitle.textContent = a.title;
  capMeta.textContent = `${a.artist} · ${a.year} · 第 ${i + 1} / ${N} 张`;
  capLink.href = a.link;
  dots.forEach((d, j) => d.classList.toggle('on', j === i));
  const show = bgFlip ? bgA : bgB, hide = bgFlip ? bgB : bgA;
  paintBg(show, a.colors);
  show.classList.add('on'); hide.classList.remove('on');
  bgFlip = !bgFlip;
}
function render() {
  cards.forEach((card, i) => {
    const off = i - pos;
    const ao = Math.abs(off);
    const rot = Math.max(-MAX_ROT, Math.min(MAX_ROT, off * -MAX_ROT));
    const depth = Math.min(MAX_DEPTH, ao * MAX_DEPTH);
    const scale = Math.max(MIN_SCALE, 1 - ao * 0.08);
    card.style.transform = `translateX(${off * CARD_GAP}px) translateZ(${-depth}px) rotateY(${rot}deg) scale(${scale})`;
    card.style.opacity = ao > 3.2 ? 0 : 1 - Math.max(0, ao - 2.2) * 0.55;
    card.style.zIndex = String(100 - Math.round(ao * 10));
    card.classList.toggle('active', Math.round(pos) === i && ao < 0.5);
  });
  setActive(clamp(Math.round(pos)));
}
function tick() {
  if (!dragging) {
    velocity *= 0.9;
    pos += velocity;
    pos += (target - pos) * 0.14;
    if (Math.abs(target - pos) < 0.002 && Math.abs(velocity) < 0.002) pos = target;
    if (pos < 0) { pos = 0; velocity = 0; target = 0; }
    if (pos > N - 1) { pos = N - 1; velocity = 0; target = N - 1; }
  }
  render();
  requestAnimationFrame(tick);
}

// drag
stage.addEventListener('pointerdown', e => {
  dragging = true; stage.classList.add('dragging');
  dragStartX = lastX = e.clientX; dragStartPos = pos; velocity = 0; lastT = performance.now();
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - dragStartX;
  const now = performance.now();
  const instV = (e.clientX - lastX) / Math.max(1, now - lastT);
  lastX = e.clientX; lastT = now;
  pos = clamp(dragStartPos - dx / 200);
  velocity = -instV / 200 * 16;
});
function endDrag() {
  if (!dragging) return;
  dragging = false; stage.classList.remove('dragging');
  target = clamp(Math.round(pos - velocity * 6));
  velocity *= 0.5;
}
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', endDrag);

// wheel (throttled)
let wheelLock = 0;
stage.addEventListener('wheel', e => {
  e.preventDefault();
  const now = performance.now();
  if (now - wheelLock < 260) return;
  wheelLock = now;
  goTo(Math.round(pos) + (e.deltaY > 0 ? 1 : -1));
}, { passive: false });

// keyboard
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') goTo(Math.round(pos) + 1);
  if (e.key === 'ArrowLeft') goTo(Math.round(pos) - 1);
});
document.getElementById('prev').addEventListener('click', () => goTo(Math.round(pos) - 1));
document.getElementById('next').addEventListener('click', () => goTo(Math.round(pos) + 1));

paintBg(bgA, ALBUMS[0].colors);
render();
tick();
</script>
</body>
</html>
